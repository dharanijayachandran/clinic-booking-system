services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    ports:
      - "5432:5432"
    volumes:
      - clinic-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clinic
      DB_USER: clinic
      DB_PASSWORD: clinic
      # Dev-only values — all overridable, none of these belong in a real
      # deployment as-is. JWT_SECRET in particular must be replaced.
      JWT_SECRET: dev-only-secret-change-me-replace-with-a-real-256-bit-key-before-any-real-deployment
      COOKIES_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:4200
      ADMIN_EMAIL: admin@clinic.local
      ADMIN_PASSWORD: changeme123
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  clinic-db-data:
