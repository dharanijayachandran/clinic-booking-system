server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular owns client-side routing: any unknown path is a route, not a
    # missing file, so fall back to index.html rather than returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the auth cookies and the XSRF double-submit work
    # exactly as they do behind the dev-server proxy.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
