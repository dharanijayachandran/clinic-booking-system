spring:
  application:
    name: clinic-booking-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinic}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks its entity mappings
      # against it at startup — it must never create or alter tables itself.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
