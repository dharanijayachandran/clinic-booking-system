# Render Blueprint — one-click deploy of the backend + a free Postgres.
# https://render.com/docs/blueprint-spec
#
# Free-tier trade-offs, accepted deliberately for a portfolio demo:
#   - The web service spins down after 15 min idle; the first request after
#     that takes ~30-50s to wake it back up.
#   - The free Postgres database expires after 30 days. When it does,
#     recreate it and this blueprint's Flyway migration (V1__init_schema.sql)
#     recreates the schema automatically on the next deploy — no data is
#     precious here, it's a demo database.

databases:
  - name: clinic-booking-db
    plan: free
    databaseName: clinic
    user: clinic

services:
  - type: web
    name: clinic-booking-backend
    runtime: docker
    # Root Dockerfile: builds the Angular app and bakes it into the Spring
    # Boot jar, so the whole system is one service on one origin.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Render injects PORT and routes to it; application.yml reads PORT first,
    # so it must NOT be pinned here or the app listens on the wrong port and
    # every request hangs with no healthy instance behind the edge.
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: clinic-booking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: clinic-booking-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: clinic-booking-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: clinic-booking-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: clinic-booking-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIES_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "https://dharanijayachandran.github.io"
      - key: ADMIN_EMAIL
        value: admin@clinic.local
      - key: ADMIN_PASSWORD
        generateValue: true
      # Demo deployment seeds doctors + slots, so the calendar isn't empty.
      - key: DEMO_SEED
        value: "true"
